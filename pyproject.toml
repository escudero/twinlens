[project]
name = "twinlens"
version = "0.1.0"
description = "Photos of an object on a green cloth -> a painted 3D model in Blender"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "opencv-python-headless",
    "pillow",
    "scikit-image",
    "trimesh",
    "shapely",
    "rtree",
    "mapbox-earcut",
    "manifold3d",
    "fast-simplification",
    "pycolmap>=4.0",
    "torch",
    "torchvision",
    "lightglue @ git+https://github.com/cvg/LightGlue.git",
    "moge @ git+https://github.com/microsoft/MoGe.git",
    "kaggle",
    "six",
]

[project.scripts]
twinlens = "twinlens.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["twinlens"]

[tool.setuptools.package-data]
twinlens = ["*.py"]
